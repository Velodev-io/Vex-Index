[project]
name = "vexindex"
version = "0.1.0"
description = "Local-first codebase indexing and search daemon for Vexon OS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "aiosqlite>=0.20.0",
    "watchfiles>=0.21.0",
    "pydantic-settings>=2.2.1",
    "tiktoken>=0.6.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-language-pack",
    "httpx",
    "qdrant-client>=1.18.0",
    "mcp>=1.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
